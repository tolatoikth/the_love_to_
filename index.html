<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cai gi vay troi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Màn hình đen khi lắc xong */
        body.dark-mode {
            background-color: #000000;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ffb6c1;
            color: #fff;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #instruction {
            display: none;
            font-size: 1.5rem;
            color: #333;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        /* CSS cho các câu chúc và icon bay lên */
        .flying-item {
            position: absolute;
            bottom: -100px;
            white-space: nowrap;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: flyUp linear forwards;
            z-index: 5;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(calc(-10deg + 20deg * var(--randRotate)));
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(1.2) rotate(calc(-20deg + 40deg * var(--randRotate)));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Nút bắt buộc để xin quyền truy cập cảm biến trên điện thoại -->
    <button id="start-btn">Nhấn vào đây có điều bất ngờ nè! 🎁</button>
    <div id="instruction">Bây giờ thử lắc điện thoại xem sao nhé! 📱👋<br><small style="font-size: 1rem; color:#666;">(Hoặc chạm vào màn hình 3 lần nếu dùng máy tính)</small></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const instruction = document.getElementById('instruction');
        let isShaken = false;

        // 15 câu chúc đủ phong cách
        const wishes = [
            "Trang ngủ ngon nhé, mơ đẹp nha! 🌙",
            "Chúc Trang một đêm bình yên và ngọt ngào. ✨",
            "Muộn rồi, nhắm mắt ngủ thôi Trang ơi! 💤",
            "Ngủ ngon nhé cô gái xinh đẹp! 🌸",
            "Chúc Trang chìm vào giấc ngủ thật êm đềm. 🧸",
            "Bỏ lại muộn phiền ngày hôm nay, ngủ ngon nhé! 💖",
            "Chúc cậu có những giấc mơ ngập tràn màu hồng. 🎀",
            "Trang ngủ ngon, mai thức dậy thật rạng rỡ nha! ☀️",
            "Gửi ngàn vì sao ru Trang ngủ ngon. 🌟",
            "Đêm nay lạnh đấy, đắp chăn ấm và ngủ ngoan nhé! ❄️",
            "Chúc cậu ngủ ngon, mệt mỏi bay đi hết! 🪄",
            "Hẹn gặp Trang trong những giấc mơ tuyệt đẹp. 🦄",
            "Chúc nữ thần của những giấc mơ ngủ ngon! 👑",
            "Cả vũ trụ chúc Trang ngủ ngon! 🌌",
            "Ngủ ngon nhé, mong sớm gặp lại nụ cười của cậu. 🫶"
        ];

        // 15 emote cute
        const emotes = ["💖", "🌙", "✨", "😴", "😽", "🧸", "🎀", "🌷", "🌟", "💤", "🐣", "🌸", "🫶", "🪄", "🍓"];

        // Bảng màu neon cho chữ nổi bật trên nền đen
        const colors = ['#FF69B4', '#00FFFF', '#39FF14', '#FFD700', '#FF1493', '#00FF00', '#FF4500', '#9400D3'];

        // Yêu cầu quyền truy cập cảm biến (Dành cho iOS 13+)
        startBtn.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        setupShakeListener();
                    } else {
                        alert('Bạn cần cấp quyền cảm biến để thấy bất ngờ nha!');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                // Các thiết bị khác (Android hoặc trình duyệt cũ) không cần request
                setupShakeListener();
            }
            startBtn.style.display = 'none';
            instruction.style.display = 'block';
        });

        // Hàm phát hiện lắc điện thoại
        function setupShakeListener() {
            let shakeThreshold = 15; // Độ nhạy của việc lắc
            let lastUpdate = 0;
            let x, y, z, lastX, lastY, lastZ;

            function motionHandler(event) {
                if (isShaken) return;

                let acceleration = event.accelerationIncludingGravity;
                let currentTime = new Date().getTime();

                if ((currentTime - lastUpdate) > 100) {
                    let diffTime = (currentTime - lastUpdate);
                    lastUpdate = currentTime;

                    x = acceleration.x;
                    y = acceleration.y;
                    z = acceleration.z;

                    let speed = Math.abs(x + y + z - lastX - lastY - lastZ) / diffTime * 10000;

                    if (speed > shakeThreshold) {
                        triggerSurprise();
                        window.removeEventListener('devicemotion', motionHandler);
                    }

                    lastX = x;
                    lastY = y;
                    lastZ = z;
                }
            }
            window.addEventListener('devicemotion', motionHandler);
        }

        // Fallback: Nếu dùng máy tính không lắc được, cho phép click vào màn hình để kích hoạt
        let clickCount = 0;
        document.body.addEventListener('click', () => {
            if (startBtn.style.display === 'none' && !isShaken) {
                clickCount++;
                if (clickCount >= 3) triggerSurprise();
            }
        });

        // Xử lý logic khi lắc thành công
        function triggerSurprise() {
            isShaken = true;
            instruction.style.display = 'none'; // Ẩn hướng dẫn

            // Chờ 3 giây trước khi chuyển đen và thả chữ
            setTimeout(() => {
                document.body.classList.add('dark-mode');
                startSpawning();
            }, 3000);
        }

        // Hàm tạo chữ và icon bay lên
        function startSpawning() {
            // Tạo câu chúc
            setInterval(() => {
                createFlyingItem(wishes[Math.floor(Math.random() * wishes.length)], 'text');
            }, 800); // 0.8s tạo 1 câu chúc

            // Tạo icon bay
            setInterval(() => {
                createFlyingItem(emotes[Math.floor(Math.random() * emotes.length)], 'icon');
            }, 300); // 0.3s tạo 1 icon
        }

        function createFlyingItem(content, type) {
            const item = document.createElement('div');
            item.classList.add('flying-item');
            item.innerText = content;

            // Vị trí ngẫu nhiên chiều ngang (10% đến 90% màn hình)
            item.style.left = Math.random() * 80 + 10 + '%';
            
            // Random biến cho CSS animate rotate
            item.style.setProperty('--randRotate', Math.random());

            // Random màu cho chữ và size
            if (type === 'text') {
                item.style.color = colors[Math.floor(Math.random() * colors.length)];
                item.style.fontSize = (Math.random() * 1 + 1.2) + 'rem'; // 1.2rem - 2.2rem
                item.style.animationDuration = (Math.random() * 3 + 5) + 's'; // Bay chậm 5-8s
            } else {
                item.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem'; // 1.5rem - 3rem
                item.style.animationDuration = (Math.random() * 2 + 4) + 's'; // Bay nhanh hơn chữ 4-6s
            }

            document.body.appendChild(item);

            // Dọn dẹp DOM sau khi bay xong để không bị lag máy
            setTimeout(() => {
                item.remove();
            }, 8000); 
        }
    </script>
</body>
</html>
